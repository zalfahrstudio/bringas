<text x="426" y="548" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#fffaf0">OVER 20</text><text x="426" y="562" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#fffaf0">MILLION</text><text x="426" y="576" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="700" fill="#fffaf0">COPIES SOLD</text>
<text x="264" y="700" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="49" font-weight="800" letter-spacing="-1.8" fill="#111">James Clear</text>
