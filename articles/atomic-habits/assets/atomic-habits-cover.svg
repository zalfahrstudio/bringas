<svg xmlns="http://www.w3.org/2000/svg" width="528" height="799" viewBox="0 0 528 799" role="img" aria-labelledby="title desc">
<title id="title">Atomic Habits — visualisasi sampul</title><desc id="desc">Visualisasi editorial sampul Atomic Habits karya James Clear dengan latar krem, judul bertitik warna emas, dan aksen lingkaran oranye. Bukan foto produk resmi.</desc>
<defs>
  <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2.2" cy="2.2" r="1.6" fill="#b78b3c"/></pattern>
  <mask id="atomicMask"><rect width="528" height="799" fill="black"/><text x="12" y="320" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="112" letter-spacing="-5" fill="white">Atomic</text><text x="18" y="430" font-family="Arial,Helvetica,sans-serif" font-weight="900" font-size="112" letter-spacing="-4" fill="white">Habits</text></mask>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffdf5"/><stop offset="1" stop-color="#f3eedf"/></linearGradient>
</defs>
<rect width="528" height="799" fill="url(#paper)"/>
<text x="264" y="49" text-anchor="middle" font-family="Georgia,serif" font-size="16" font-weight="700" letter-spacing="4" fill="#171717">THE INTERNATIONAL BESTSELLER</text>
<text x="264" y="105" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#171717">Tiny Changes,</text>
<text x="264" y="143" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#171717">Remarkable Results</text>
<rect x="0" y="185" width="528" height="270" fill="url(#dots)" mask="url(#atomicMask)"/>
<g fill="#b78b3c" opacity=".72"><circle cx="25" cy="202" r="2"/><circle cx="61" cy="177" r="1.5"/><circle cx="492" cy="185" r="2"/><circle cx="466" cy="460" r="1.6"/><circle cx="42" cy="466" r="1.5"/><circle cx="505" cy="301" r="1.7"/><circle cx="20" cy="350" r="1.5"/></g>
<text x="264" y="510" text-anchor="middle" font-family="Georgia,serif" font-size="21" font-weight="700" fill="#171717">An Easy &amp; Proven Way</text>
<text x="264" y="540" text-anchor="middle" font-family="Georgia,serif" font-size="21" font-weight="700" fill="#171717">to Build Good Habits</text>
<text x="264" y="570" text-anchor="middle" font-family="Georgia,serif" font-size="21" font-weight="700" fill="#171717">&amp; Break Bad Ones</text>
